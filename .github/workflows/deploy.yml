name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build frontend with production API URL
        env:
          # The API origin is public (not a credential). The repository secret can
          # override the known production Timeweb hostname on a future migration.
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://dantilor-telegram-card-game-3706.twc1.net' }}
          VITE_API_BASE: ${{ secrets.VITE_API_URL || 'https://dantilor-telegram-card-game-3706.twc1.net' }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Missing production VITE_API_URL."
            exit 1
          fi
          npm run build
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
