name: Mini App and API quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miniapp:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Production build
        env:
          VITE_API_URL: https://dantilor-telegram-card-game-3706.twc1.net
          VITE_API_BASE: https://dantilor-telegram-card-game-3706.twc1.net
        run: npm run build

  api:
    name: API tests and production compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
