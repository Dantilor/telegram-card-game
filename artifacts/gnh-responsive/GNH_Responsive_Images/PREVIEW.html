<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Предпросмотр: новые широкие обложки и портал</title><style>*{box-sizing:border-box}body{margin:0;background:#21132e;color:#f6eaff;font-family:system-ui,sans-serif}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:18px 22px;background:#352045;border-bottom:1px solid #e2b5ff3d}.toolbar b{margin-right:auto}.toolbar button,.toolbar a{font:inherit;border:1px solid #e1b5ff66;border-radius:9px;padding:8px 12px;color:#f5e2ff;background:#624075;text-decoration:none;font-size:13px}.toolbar button[aria-pressed=true]{background:#ba86d1;color:white}p{margin:15px 22px;color:#d7b9e4;font-size:13px}#stage{width:100%;overflow:auto;padding:0 18px 25px}iframe{display:block;width:100%;height:1000px;border:1px solid #e0b1fb44;border-radius:18px;margin:auto;background:#563569}</style></head><body><div class="toolbar"><b>Новые широкие сцены</b><button data-width="100%" aria-pressed="true">На весь экран</button><button data-width="1440px" aria-pressed="false">1440</button><button data-width="768px" aria-pressed="false">768</button><button data-width="390px" aria-pressed="false">Телефон 390</button><a href="preview-screen.html" target="_blank">Открыть отдельно</a></div><p>Переключение desktop/mobile происходит внутри макета. Изображения показаны целиком, без изменения пропорций. Это просмотр ассетов, не замена приложения.</p><div id="stage"><iframe id="screen" title="Правильные пропорции изображений" src="preview-screen.html"></iframe></div><script>document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('screen').style.width=b.dataset.width;document.querySelectorAll('[data-width]').forEach(a=>a.setAttribute('aria-pressed',String(a===b)));}));</script></body></html>
