# Optional edge nginx for Timeweb / custom VPS when Express is not serving static.
# Upstream Express listens on 127.0.0.1:3001 (API only).
# TLS is usually terminated by Timeweb; this file is for HTTP→app inside the network.

upstream gnh_staging_api {
  server 127.0.0.1:3001;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Real client scheme/host for Express trust proxy + Secure cookies.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  location = /health {
    proxy_pass http://gnh_staging_api/health;
  }

  location /api/ {
    proxy_pass http://gnh_staging_api/api/;
  }

  location /legal/ {
    proxy_pass http://gnh_staging_api/legal/;
  }

  location /public/ {
    proxy_pass http://gnh_staging_api/public/;
  }

  # SPA fallback for BrowserRouter deep links (/premium, /sled?room=…).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
