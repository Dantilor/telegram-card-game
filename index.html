<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8e6f5" />
    <!-- Fonts: self-hosted @fontsource (latin + cyrillic only). No Google Fonts. -->
    <!-- Telegram SDK: injected async from same-origin ./telegram-web-app.js in main.tsx
         (see src/lib/telegramSdk.ts). Do not add a blocking telegram.org script here. -->
    <title>GameNight Host</title>
  </head>
  <body>
    <!-- Theme paint before React. Telegram colors applied again when SDK becomes ready. -->
    <script>
      (function() {
        var theme = localStorage.getItem('tcg_theme');
        var colors = {
          'neon-dark': '#070814',
          'neon-light': '#e8e6f5',
          'sunset': '#1c1917',
          'minimal-calm': '#0f172a'
        };
        if (!theme || !colors[theme]) theme = 'neon-light';
        document.documentElement.dataset.theme = theme;
        var bg = colors[theme];
        document.documentElement.style.backgroundColor = bg;
        document.body.style.backgroundColor = bg;

        function applyTelegramChrome() {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (!tg) return;
          try { tg.ready(); tg.expand(); } catch (e) {}
          var v = parseFloat(tg.version || '0');
          if (v > 6) {
            try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
          }
        }

        applyTelegramChrome();
        document.addEventListener('DOMContentLoaded', applyTelegramChrome);
        window.addEventListener('gnh:telegram-sdk-ready', applyTelegramChrome);
        setTimeout(applyTelegramChrome, 300);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
