<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Card Game</title>
  </head>
  <body>
    <div id="boot-debug" style="position:fixed;left:8px;bottom:8px;z-index:999999;background:rgba(0,0,0,.7);color:#fff;padding:6px 8px;border-radius:8px;font:12px/1.2 monospace;max-width:90vw;display:none;white-space:pre-wrap;word-break:break-all;"></div>
    <div id="root">
      <div id="html-boot"
           style="position:fixed;left:12px;top:12px;z-index:999999;background:rgba(0,0,0,.7);color:#fff;padding:8px 10px;border-radius:10px;font:13px/1.2 monospace">
        HTML BOOT OK (no JS yet)
      </div>
    </div>
    <script>
      (function() {
        var dbg = document.getElementById('boot-debug');
        var search = location.search || (location.hash.indexOf('?') >= 0 ? '?' + location.hash.split('?')[1] : '');
        var enabled = new URLSearchParams(search).get('debug') === '1';
        if (dbg && enabled) {
          dbg.style.display = 'block';
          dbg.textContent = 'HTML OK';
          window.onerror = function(msg, src, line, col, err) {
            dbg.textContent = (dbg.textContent || '') + '\nERR: ' + msg + (err && err.stack ? '\n' + err.stack : '');
          };
          window.onunhandledrejection = function(e) {
            var r = e.reason;
            dbg.textContent = (dbg.textContent || '') + '\nREJ: ' + (r && (r.message || String(r))) + (r && r.stack ? '\n' + r.stack : '');
          };
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
