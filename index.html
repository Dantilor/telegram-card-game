<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070814" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>GameNight Host</title>
  </head>
  <body>
    <!-- Раннее применение фона и цветов Telegram. Retry — некоторые клиенты инициализируются позже. -->
    <script>
      (function() {
        var theme = localStorage.getItem('tcg_theme');
        var colors = {
          'neon-dark': '#070814',
          'neon-light': '#e8e6f5',
          'portal': '#061410',
          'sunset': '#1c1917',
          'minimal-calm': '#0f172a'
        };
        var bg = (theme && colors[theme]) ? colors[theme] : '#070814';
        document.documentElement.style.backgroundColor = bg;
        document.body.style.backgroundColor = bg;

        function applyColors() {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (tg) {
            try { tg.ready(); tg.expand(); } catch (e) {}
            try {
              tg.setHeaderColor(bg);
              tg.setBackgroundColor(bg);
            } catch (e) {}
          }
        }

        applyColors();
        document.addEventListener('DOMContentLoaded', applyColors);
        setTimeout(applyColors, 100);
        setTimeout(applyColors, 300);
        setTimeout(applyColors, 800);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
